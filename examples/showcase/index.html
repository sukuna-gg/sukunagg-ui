<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      SITE_URL: the absolute origin below is the default. `scripts/prerender.ts` rewrites every
      occurrence of it in the built HTML when the SITE_URL env var is set, so a custom domain is one
      environment variable at build time.
    -->
    <title>sukuna-ui — SSR-safe, accessible React components for dark-first UIs</title>
    <meta
      name="description"
      content="sukuna-ui is a React component library: 30 components on Tailwind v4 tokens, SSR/RSC-safe, WCAG AA, dark-first with a light mode, and documented for AI coding agents via llms.txt."
    />
    <meta name="theme-color" content="#0A0A0B" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://sukuna-ui.vercel.app/" />
    <!-- Brand favicon set (brand/favicon): the Ember Gate mark. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#FF3B4E" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="alternate" type="text/markdown" href="/llms.txt" title="llms.txt" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="sukuna-ui" />
    <meta property="og:title" content="sukuna-ui — SSR-safe, accessible React components for dark-first UIs" />
    <meta
      property="og:description"
      content="30 React components on Tailwind v4 tokens. SSR/RSC-safe, WCAG AA, dark-first with light mode, built for AI agents."
    />
    <meta property="og:url" content="https://sukuna-ui.vercel.app/" />
    <meta property="og:image" content="https://sukuna-ui.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="sukuna-ui — Accessible React components. One crimson." />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="sukuna-ui — SSR-safe, accessible React components for dark-first UIs" />
    <meta
      name="twitter:description"
      content="30 React components on Tailwind v4 tokens. SSR/RSC-safe, WCAG AA, dark-first with light mode, built for AI agents."
    />
    <meta name="twitter:image" content="https://sukuna-ui.vercel.app/og.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;900&display=swap"
      rel="stylesheet"
    />

    <!-- softwareVersion is replaced at prerender time with the root package.json version. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "SoftwareApplication",
            "@id": "https://sukuna-ui.vercel.app/#software",
            "name": "@sukunagg/ui",
            "applicationCategory": "DeveloperApplication",
            "operatingSystem": "Any",
            "description": "React component library: 30 components on Tailwind v4 tokens, SSR/RSC-safe, WCAG AA, dark-first with light mode, built for AI coding agents.",
            "url": "https://sukuna-ui.vercel.app/",
            "image": "https://sukuna-ui.vercel.app/og.png",
            "softwareVersion": "0.5.0",
            "license": "https://opensource.org/licenses/MIT",
            "codeRepository": "https://github.com/sukuna-gg/sukunagg-ui",
            "programmingLanguage": "TypeScript",
            "installUrl": "https://www.npmjs.com/package/@sukunagg/ui",
            "offers": { "@type": "Offer", "price": 0, "priceCurrency": "USD" },
            "author": { "@type": "Person", "name": "arielplas", "url": "https://github.com/arielplas" }
          },
          {
            "@type": "BreadcrumbList",
            "@id": "https://sukuna-ui.vercel.app/#breadcrumbs",
            "itemListElement": [
              {
                "@type": "ListItem",
                "position": 1,
                "name": "Home",
                "item": "https://sukuna-ui.vercel.app/"
              }
            ]
          }
        ]
      }
    </script>

    <style>
      body {
        margin: 0;
        background: var(--sk-bg);
        color: var(--sk-text);
        font-family: var(--sk-font-sans);
        transition: background 200ms ease;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
        scroll-padding-top: 80px;
      }
      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
