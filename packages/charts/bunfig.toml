[test]
# register-dom.ts MUST come first: it registers happy-dom before setup.ts imports Testing Library
# (which binds `screen` to `document.body` at import time). See test/register-dom.ts.
preload = ["../../test/register-dom.ts", "../../test/setup.ts"]
coverage = true
coverageReporter = ["text", "lcov"]
coverageDir = "coverage"
coverageSkipTestFiles = true

# Coverage floor: 90%, enforced (run exits non-zero below it), locally and in CI.
#
# NOTE: the per-metric object form `{ line = 0.9, function = 0.9, statement = 0.9 }`
# (which docs/testing.md originally specified) is SILENTLY IGNORED by Bun 1.3.12 —
# it parses but never fails the run. The scalar form below is enforced, and it checks
# every metric Bun tracks (functions AND lines; "statement" folds into lines), so a
# file below 90% on either fails. Verified with a probe (funcs 100% / lines 50% → exit 1).
# Revisit if Bun fixes the object form. See docs/testing.md § Coverage policy.
coverageThreshold = 0.9

# Files that carry no logic worth measuring.
coveragePathIgnorePatterns = [
  "src/**/*.stories.tsx",
  "src/**/index.tsx",
  "src/index.ts",
  "../../test/**",
  # @sukunagg/ui resolves to its source in dev (tsconfig paths); its own suite covers it.
  "../ui/**",
  "../video/**",
  "../../scripts/**",
  "scripts/**",
]
