name: npm token check

# Verifies the NPM_TOKEN secret can publish to the @sukunagg scope without a 2FA prompt, without
# publishing anything: whoami, read-write access on both packages, then a real write that changes
# nothing — re-point `latest` at the version it already has — which npm rejects exactly like a
# publish when the token can't bypass 2FA. (Don't add + remove a temporary tag: granular tokens can
# add dist-tags but get a 403 removing them, which leaves the tag behind.)
# Run it from the Actions tab (or `gh workflow run npm-token-check.yml`) after rotating the token.
# The loops below list published packages only: add a package (@sukunagg/charts, @sukunagg/fx) once
# it exists on npm, since `npm view` fails on an unpublished name (docs/releasing.md, one-time setup).
on:
  workflow_dispatch:
  push:
    branches: [docs/video-standalone-plan]
    paths: [.github/workflows/npm-token-check.yml]

permissions:
  contents: read

jobs:
  check:
    name: NPM_TOKEN can write @sukunagg
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Authenticate npm
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc

      - name: Token authenticates
        run: |
          echo "npm user: $(npm whoami)"

      - name: Read-write on both packages
        run: |
          access=$(npm access list packages @sukunagg --json)
          echo "$access"
          for pkg in @sukunagg/ui @sukunagg/video; do
            echo "$access" | grep -q "\"$pkg\": \"read-write\"" || { echo "::error::no read-write on $pkg"; exit 1; }
          done

      - name: Real write without 2FA (re-point latest at its current version)
        run: |
          for pkg in @sukunagg/ui @sukunagg/video; do
            latest=$(npm view "$pkg" dist-tags.latest)
            npm dist-tag add "$pkg@$latest" latest
          done
